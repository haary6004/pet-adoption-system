databases:
  - name: paw-haven-db
    databaseName: paw_haven
    user: paw_haven
    plan: free

services:
  - type: web
    name: paw-haven
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paw-haven-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
